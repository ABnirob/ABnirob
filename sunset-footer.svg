<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220">
  <defs>
    <linearGradient id="ssky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d0620"/>
      <stop offset="20%" stop-color="#2a0a4a"/>
      <stop offset="42%" stop-color="#8b1a3a"/>
      <stop offset="62%" stop-color="#c94f1a"/>
      <stop offset="80%" stop-color="#e8831a"/>
      <stop offset="100%" stop-color="#f8c94a"/>
    </linearGradient>
    <linearGradient id="socean" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7b1f6a" stop-opacity="0.7"/>
      <stop offset="35%" stop-color="#3a0d55"/>
      <stop offset="100%" stop-color="#0a0218"/>
    </linearGradient>
    <radialGradient id="ssunhalo" cx="50%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#f8c94a" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#e8831a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8b1a3a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ssunglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff5b0" stop-opacity="1"/>
      <stop offset="40%" stop-color="#f8c94a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#e8831a" stop-opacity="0"/>
    </radialGradient>
    <filter id="sblur1">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="sblur2">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <clipPath id="sclip">
      <rect width="900" height="220"/>
    </clipPath>
  </defs>

  <g clip-path="url(#sclip)">
    <!-- Sky -->
    <rect width="900" height="220" fill="url(#ssky)"/>

    <!-- Horizon glow -->
    <ellipse cx="450" cy="130" rx="430" ry="48" fill="url(#ssunhalo)" filter="url(#sblur1)"/>

    <!-- Sun soft glow -->
    <ellipse cx="450" cy="132" rx="65" ry="45" fill="#e8831a" opacity="0.3" filter="url(#sblur1)"/>

    <!-- Sun body (half setting) -->
    <ellipse cx="450" cy="134" rx="36" ry="36" fill="url(#ssunglow)" filter="url(#sblur2)"/>
    <ellipse cx="450" cy="134" rx="30" ry="30" fill="#fffacc"/>

    <!-- Hide bottom half with ocean -->
    <rect x="348" y="134" width="204" height="40" fill="#7b1f6a" opacity="0.7"/>

    <!-- Horizon line shimmer -->
    <line x1="0" y1="134" x2="900" y2="134" stroke="#f8c94a" stroke-width="0.7" opacity="0.35"/>

    <!-- Stars appearing at top -->
    <g fill="white">
      <circle cx="70"  cy="14"  r="1.4" opacity="0.8"/>
      <circle cx="160" cy="8"   r="1.1" opacity="0.7"/>
      <circle cx="250" cy="28"  r="1.0" opacity="0.55"/>
      <circle cx="340" cy="12"  r="0.9" opacity="0.5"/>
      <circle cx="560" cy="20"  r="0.8" opacity="0.45"/>
      <circle cx="650" cy="10"  r="1.2" opacity="0.65"/>
      <circle cx="740" cy="32"  r="1.0" opacity="0.55"/>
      <circle cx="830" cy="15"  r="1.3" opacity="0.7"/>
      <!-- Venus - bright evening star -->
      <circle cx="680" cy="52"  r="2.2" opacity="0.9"/>
      <circle cx="120" cy="48"  r="0.8" opacity="0.4"/>
    </g>

    <!-- Clouds silhouettes -->
    <ellipse cx="180" cy="72" rx="70" ry="16" fill="#5a1530" opacity="0.55"/>
    <ellipse cx="230" cy="66" rx="45" ry="12" fill="#6b1a38" opacity="0.45"/>
    <ellipse cx="720" cy="68" rx="65" ry="14" fill="#5a1530" opacity="0.5"/>
    <ellipse cx="770" cy="62" rx="40" ry="11" fill="#6b1a38" opacity="0.4"/>

    <!-- Ocean -->
    <rect y="134" width="900" height="86" fill="url(#socean)"/>

    <!-- Sun reflection on water -->
    <ellipse cx="450" cy="147" rx="25" ry="5" fill="#fffacc" opacity="0.5"/>
    <polygon points="436,147 464,147 456,220 444,220" fill="#f8c94a" opacity="0.07"/>

    <!-- Wave layer 1 - back -->
    <path d="M0 144 Q35 137 70 144 Q105 151 140 144 Q175 137 210 144 Q245 151 280 144 Q315 137 350 144 Q385 151 420 144 Q455 137 490 144 Q525 151 560 144 Q595 137 630 144 Q665 151 700 144 Q735 137 770 144 Q805 151 840 144 Q870 137 900 144 L900 162 L0 162 Z" fill="#7b1f6a" opacity="0.55"/>

    <!-- Wave layer 2 -->
    <path d="M0 156 Q45 149 90 156 Q135 163 180 156 Q225 149 270 156 Q315 163 360 156 Q405 149 450 156 Q495 163 540 156 Q585 149 630 156 Q675 163 720 156 Q765 149 810 156 Q855 163 900 156 L900 180 L0 180 Z" fill="#3a0d55" opacity="0.7"/>

    <!-- Wave layer 3 - front -->
    <path d="M0 170 Q55 163 110 170 Q165 177 220 170 Q275 163 330 170 Q385 177 440 170 Q495 163 550 170 Q605 177 660 170 Q715 163 770 170 Q825 177 900 170 L900 200 L0 200 Z" fill="#1a0530" opacity="0.85"/>

    <!-- Wave foam highlights - purple tinted -->
    <path d="M0 152 Q35 149 70 152 Q105 155 140 152" stroke="#d4a0e8" stroke-width="1" fill="none" opacity="0.38"/>
    <path d="M240 160 Q285 157 330 160 Q375 163 420 160" stroke="#d4a0e8" stroke-width="1" fill="none" opacity="0.32"/>
    <path d="M540 153 Q590 150 640 153 Q690 156 740 153" stroke="#d4a0e8" stroke-width="0.9" fill="none" opacity="0.35"/>
    <path d="M790 163 Q840 160 900 163" stroke="#d4a0e8" stroke-width="0.8" fill="none" opacity="0.28"/>

    <!-- Deep dark water -->
    <rect y="205" width="900" height="15" fill="#0a0218" opacity="0.95"/>

    <!-- Footer text -->
    <text x="450" y="62" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="400" fill="#f8c94a" opacity="0.9" letter-spacing="3">BUILDING SCALABLE DATA SYSTEMS TODAY</text>
    <text x="450" y="84" text-anchor="middle" font-family="Georgia, serif" font-size="13" font-weight="400" fill="#e8c0f0" opacity="0.75" letter-spacing="2">TO POWER INTELLIGENT AI-DRIVEN DECISIONS TOMORROW</text>
  </g>
</svg>
