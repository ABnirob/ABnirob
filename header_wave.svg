<svg width="100%" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">

  <!-- 🌊 Your Wave (keep your existing paths) -->
  <path d="M0,160 C300,250 900,50 1200,150 L1200,0 L0,0 Z" fill="#0f2027"/>
  <path d="M0,200 C300,300 900,100 1200,180 L1200,0 L0,0 Z" fill="#203a43" opacity="0.7"/>

  <!-- 🔥 TYPING TEXT -->
  <text x="50%" y="55%" text-anchor="middle"
        fill="white" font-size="28"
        font-family="Fira Code, monospace">

    <tspan>
      <animate attributeName="textLength" from="0" to="350" dur="3s" fill="freeze"/>
      Md. Abul Bashar Nirob
    </tspan>

  </text>

  <!-- 🔥 SECOND LINE -->
  <text x="50%" y="70%" text-anchor="middle"
        fill="#00D4FF" font-size="16"
        font-family="Fira Code, monospace">

    <tspan>
      <animate attributeName="textLength" from="0" to="700" dur="5s" fill="freeze"/>
      Data & Business Analyst | Future Data Engineer
    </tspan>

  </text>

</svg>
