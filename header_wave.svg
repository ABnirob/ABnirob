<svg viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">

  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#01010f"/>
      <stop offset="40%" stop-color="#061a3a"/>
      <stop offset="100%" stop-color="#0f2a3a"/>
    </linearGradient>

    <linearGradient id="ocean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081826"/>
      <stop offset="100%" stop-color="#123a5a"/>
    </linearGradient>

  </defs>

  <rect width="100%" height="100%" fill="url(#sky)"/>

  <!-- Moon -->
  <circle cx="950" cy="80" r="34" fill="white"/>
  <circle cx="962" cy="75" r="34" fill="#01010f"/>

  <!-- Stars -->
  <circle cx="120" cy="60" r="1.5" fill="white"/>
  <circle cx="300" cy="90" r="1.2" fill="white"/>
  <circle cx="600" cy="50" r="1.3" fill="white"/>

  <!-- Ocean -->
  <rect y="170" width="1200" height="200" fill="url(#ocean)"/>

  <!-- Waves -->
  <path d="M0,240 C300,300 900,180 1200,240 L1200,360 L0,360 Z" fill="white" opacity="0.12"/>

  <!-- Text -->
  <text x="50%" y="120" text-anchor="middle" fill="white" font-size="34" font-family="monospace">
    Md. Abul Bashar Nirob
  </text>

  <text x="50%" y="155" text-anchor="middle" fill="#00D4FF" font-size="16" font-family="monospace">
    Data & Business Analyst | Future Data Engineer
  </text>

</svg>